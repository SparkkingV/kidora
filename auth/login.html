<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#07111f">

    <title>KIDORA | Login</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet"
          href="../css/main.css">

    <link rel="stylesheet"
          href="../css/auth.css">

</head>


<body>

<div class="auth-page">

    <!-- BACKGROUND -->

    <div class="auth-glow auth-glow-one"></div>

    <div class="auth-glow auth-glow-two"></div>


    <!-- AUTH CARD -->

    <div class="auth-wrapper">


        <!-- LOGO -->

        <a href="../index.html"
           class="auth-logo">

            <div class="logo-icon">

                <i class="fa-solid fa-brain"></i>

            </div>

            <div class="logo-text">

                <span>KID</span>
                <strong>ORA</strong>

            </div>

        </a>


        <!-- CARD -->

        <div class="auth-card">


            <div class="auth-heading">

                <div class="auth-label">
                    WELCOME BACK
                </div>

                <h1>
                    Welcome to
                    <span>KIDORA.</span>
                </h1>

                <p>
                    Sign in to continue your
                    therapy monitoring journey.
                </p>

            </div>


            <!-- ERROR -->

            <div id="authError"
                 class="auth-message error">

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember">

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="loginButton">

                    <span>
                        Sign In
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- REGISTER -->

            <div class="auth-divider">

                <span>
                    New to KIDORA?
                </span>

            </div>


            <a href="register.html"
               class="register-link">

                Create an account

                <i class="fa-solid fa-arrow-right"></i>

            </a>


        </div>


        <a href="../index.html"
           class="back-home">

            <i class="fa-solid fa-arrow-left"></i>

            Back to KIDORA

        </a>

    </div>

</div>


<script src="../js/auth.js"></script>

</body>

</html>
